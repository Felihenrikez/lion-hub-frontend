<article
  class="flex h-full flex-col gap-[1.15rem] overflow-hidden rounded-[18px] bg-[linear-gradient(165deg,#0f4463_0%,#145a7e_48%,#0d3550_100%)] p-5 text-white shadow-[0_12px_28px_rgba(15,68,99,0.28)] transition duration-200 hover:-translate-y-1 hover:shadow-[0_16px_34px_rgba(15,68,99,0.35)]"
>
  <header>
    <div class="flex items-start justify-between gap-4">
      <h3 class="m-0 min-w-0 flex-1 text-xl leading-tight font-semibold text-white">
        {{ client().name }}
      </h3>
      <div class="flex min-w-[7.5rem] max-w-44 flex-1 flex-col gap-1.5">
        <div class="flex items-baseline justify-between text-sm opacity-90">
          <span>Éxito de deploy</span>
          <strong class="text-lg">{{ successRate() }}%</strong>
        </div>
        <div class="h-2 overflow-hidden rounded-full bg-white/15" aria-hidden="true">
          <span
            class="block h-full rounded-full bg-gradient-to-r from-[#39c0ef] to-[#7ddea4]"
            [style.width.%]="successRate()"
          ></span>
        </div>
      </div>
    </div>
  </header>

  <div class="grid grid-cols-1 gap-3">
    @for (metric of summaryMetrics(); track metric.key) {
      <div
        class="flex min-h-[4.6rem] min-w-0 items-center justify-between gap-3 rounded-[14px] border border-white/15 bg-white/10 px-4 py-3 text-left"
      >
        <div class="flex min-w-0 flex-col gap-1 pr-3">
          <span class="text-xs leading-tight tracking-[0.04em] uppercase opacity-80">
            {{ metric.label }}
          </span>
          <span class="truncate text-xs opacity-65">{{ metric.hint }}</span>
        </div>
        <strong
          class="shrink-0 text-[1.7rem] leading-none font-bold text-white"
          [class.text-[#7ddea4]]="metric.tone === 'success'"
          [class.text-[#ff9b9b]]="metric.tone === 'danger'"
        >
          {{ metric.value }}
        </strong>
      </div>
    }
  </div>

  <a
    [routerLink]="['/client', client().id]"
    class="mt-auto inline-flex items-center justify-center rounded-xl bg-lion-500 px-4 py-3.5 font-semibold text-white no-underline transition-colors hover:bg-[#18a8e4] focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-white"
  >
    Abrir dashboard
  </a>
</article>
