<header class="mb-8">
  <div class="mb-3 flex items-center justify-between gap-3">
    @if (backLink(); as link) {
      <a
        [routerLink]="link"
        [queryParams]="backQuery()"
        class="text-sm font-semibold text-lion-800 no-underline hover:text-lion-500"
      >
        ← {{ backLabel() }}
      </a>
    } @else {
      <span></span>
    }
    <app-button (clicked)="logout.emit()">Cerrar sesión</app-button>
  </div>

  <div class="flex flex-col items-center justify-center gap-4 text-center sm:flex-row sm:text-left">
    <img
      src="/assets/lion-mark-transparent.png"
      alt="LION Consulting"
      class="h-auto w-[min(78px,18vw)] shrink-0 drop-shadow-[0_8px_16px_rgba(15,68,99,0.14)]"
    />
    <div class="flex min-w-0 flex-col gap-1">
      <h1
        class="m-0 text-[clamp(1.35rem,2.2vw,1.85rem)] leading-tight font-bold tracking-[0.3px] text-lion-800"
      >
        {{ title() }}
      </h1>
      @if (subtitle()) {
        <p class="m-0 max-w-3xl text-[0.95rem] text-[#4f6578]">{{ subtitle() }}</p>
      }
    </div>
  </div>
</header>
