<section
  class="w-full max-w-[420px] rounded-2xl border border-lion-100 bg-white p-8 text-center shadow-[0_12px_30px_rgba(15,68,99,0.08)]"
>
  <img src="/assets/lion-logo.png" alt="Logo LION Consulting" class="mx-auto mb-2 w-[120px]" />
  <h1 class="m-0 text-3xl font-bold text-lion-800">Iniciar sesión</h1>
  <p class="mb-4 mt-2.5 text-[#5a5f66]">
    Accede al hub de checklist o al gobierno de interfaces.
  </p>

  <form (ngSubmit)="submit()" class="text-left">
    <div class="mb-4">
      <label for="inputEmail" class="mb-1.5 block font-semibold text-lion-800">Usuario</label>
      <input
        type="text"
        class="w-full rounded-lg border border-lion-100 bg-white px-3 py-2.5 text-[#162530] outline-none transition focus:border-lion-500 focus:ring-3 focus:ring-lion-500/15"
        id="inputEmail"
        name="username"
        autocomplete="username"
        [(ngModel)]="username"
      />
      <div class="mt-1 text-sm text-[#687781]">Ingresa tu usuario asignado.</div>
    </div>
    <div class="mb-4">
      <label for="inputPassword" class="mb-1.5 block font-semibold text-lion-800">Clave</label>
      <input
        type="password"
        class="w-full rounded-lg border border-lion-100 bg-white px-3 py-2.5 text-[#162530] outline-none transition focus:border-lion-500 focus:ring-3 focus:ring-lion-500/15"
        id="inputPassword"
        name="password"
        autocomplete="current-password"
        [(ngModel)]="password"
      />
    </div>

    @if (errorMessage) {
      <div
        class="mb-4 rounded-lg border border-red-200 bg-red-50 px-3 py-2 text-sm font-medium text-red-800"
        role="alert"
      >
        {{ errorMessage }}
      </div>
    }

    <app-button type="submit" [fullWidth]="true">Entrar</app-button>
  </form>
</section>
